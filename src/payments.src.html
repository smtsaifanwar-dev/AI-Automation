<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='bpPaymentFollowUp.v1',DEF={business:'',sender:'',instr:'',cur:'INR',tz:'Asia/Kolkata',dueSoonDays:3,order:'DMY',cc:'91'};
/* RESCUE holds saved text that exists but could not be read (damaged, or written by a newer version). While it is set, save() never writes,
   so the unreadable data stays in the browser untouched until the user downloads it, restores a backup, or chooses to start fresh. */
let RESCUE=null;
function load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 const fresh=()=>({v:1,S:{...DEF},inv:[],pay:[],con:[],tsk:[],bat:[]});
 if(!raw)return fresh();
 try{const j=JSON.parse(raw);if(j&&j.v===1){j.S={...DEF,...j.S};return j}}catch(e){}
 RESCUE=raw;return fresh()}
let SUM=null,M=load(),T='ov',F={q:'',st:'',cur:'',limit:100},STG=null,OPEN=null,RM={id:'',tpl:'',dirty:false,subject:'',body:''},saveErr=false;
const save=()=>{if(RESCUE!==null)return;try{localStorage.setItem(KEY,JSON.stringify(M));saveErr=false}catch(e){saveErr=true}};
const today=()=>PF.todayISO(M.S.tz),rows=()=>PF.rowsOf(M,today()),$f=(v,c)=>PF.fmt(v,c);
const aud=(i,a)=>(i.audit=i.audit||[]).push({ts:new Date().toISOString(),a});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)}
const TABS=[['ov','Overview'],['inv','Invoices'],['rem','Reminders'],['imp','Import / Export'],['set','Settings']];
const badge=s=>`<span class="st ${s.replace(/ /g,'')}">${s}</span>`;
function pass(r){if(F.cur&&r.inv.currency!==F.cur)return false;const s=F.st;
 if(s==='partial'&&!r.partial)return false;if(s==='due7'&&!(r.open&&r.daysTo!=null&&r.daysTo>=0&&r.daysTo<=7))return false;
 if(s==='fu'&&!(r.next&&r.next<=today()))return false;if(s==='flag'&&!r.flags.length)return false;if(s==='Hold'&&!['Disputed','On Hold'].includes(r.status))return false;
 if(s&&!['partial','due7','fu','flag','Hold'].includes(s)&&r.status!==s)return false;
 const q=F.q.toLowerCase();return!q||[r.inv.invoiceNo,r.inv.customer,r.inv.email,r.inv.phone].some(x=>String(x||'').toLowerCase().includes(q))}
const ovSum=a=>{const t={};a.forEach(r=>t[r.inv.currency]=(t[r.inv.currency]||0)+r.bal);return Object.entries(t).map(([c,v])=>' · '+c+' '+$f(v,c)).join('')};
function vSum(rs){const S=SUM||{n:0,d:0,x:0},ov=rs.filter(r=>r.status==='Overdue').sort((a,b)=>b.pr.s-a.pr.s),soon=rs.filter(r=>r.status==='Due Soon');
 return`<div class="dg" role="dialog" aria-label="Import summary" style="max-width:520px"><h1>✓ ${S.n} invoice${S.n===1?'':'s'} imported</h1>
 <p class="mu">${S.d?S.d+' duplicate'+(S.d===1?'':'s')+' skipped. ':''}${S.x?S.x+' row'+(S.x===1?'':'s')+' not imported (see Import history). ':''}</p>
 ${ov.length?`<div class="msg e"><b>${ov.length} overdue</b>${ovSum(ov)}</div>`:'<div class="msg i">Nothing is overdue right now.</div>'}
 ${soon.length?`<div class="msg"><b>${soon.length} due soon</b> (within ${M.S.dueSoonDays} days)</div>`:''}
 <div class="row">${ov.length?'<button class="btn p" data-a="flt" data-v="Overdue">Show overdue only</button>':''}<button class="btn ${ov.length?'':'p'}" data-a="flt" data-v="">Show all invoices</button>${ov.length?`<button class="btn" data-a="rem" data-v="${ov[0].inv.id}">Draft reminders</button>`:''}</div></div>`}
function vOv(rs){
 if(!M.inv.length)return`<div class="card" style="text-align:center;padding:26px 16px"><b style="font-size:18px">Start by adding your unpaid invoices</b><p class="mu">Drop a payment sheet below. Overdue invoices and ready-to-send reminders appear right after.</p><div class="dz" data-a="pick" tabindex="0" role="button" style="padding:34px 18px;font-size:16px">Drop Excel / CSV here or click to choose</div><button class="btn" data-a="add">Or add one invoice by hand</button></div>`;
 const T=PF.totals(rs),c=k=>rs.filter(r=>r.status===k).length,k=(l,v,f,c='')=>`<button class="${c}" data-a="flt" data-v="${f}"><span class="mu">${l}</span><b>${v}</b></button>`;
 const fu=M.tsk.filter(t=>t.status!=='done').sort((a,b)=>a.date<b.date?-1:1),due=fu.filter(t=>t.date<=today());
 const ex=rs.filter(r=>r.flags.length);
 const ovr=rs.filter(r=>r.status==='Overdue');
 const soonN=c('Due Soon');
 return`${ovr.length?`<div class="hero"><div><div class="hn">${ovr.length} overdue invoice${ovr.length>1?'s':''}</div><div class="hs">${esc(ovSum(ovr).replace(/^ · /,'').split(' · ').join('  ·  '))}</div></div><div class="ha"><button class="btn hp" data-a="rem" data-v="${ovr[0].inv.id}">Draft reminders</button><button class="btn hg" data-a="flt" data-v="Overdue">Review list</button></div></div>`:`<div class="hero ok"><div><div class="hn">Nothing overdue</div><div class="hs">${soonN?soonN+' invoice'+(soonN>1?'s':'')+' due soon':'You are all caught up'}</div></div><div class="ha"><button class="btn hg" data-a="flt" data-v="">See all invoices</button></div></div>`}
 ${Object.keys(T).length?`<div class="card"><table class="ct"><thead><tr><th>Currency</th><th class="n">Outstanding</th><th class="n">Overdue</th><th class="n">Due in 7 days</th></tr></thead><tbody>${Object.entries(T).map(([cur,t])=>`<tr><td><b>${cur}</b></td><td class="n">${$f(t.out,cur)}</td><td class="n er">${$f(t.over,cur)}</td><td class="n">${$f(t.due7,cur)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card mu">No open balances.</div>'}
 <div class="kp">${k('Overdue',c('Overdue'),'Overdue','k-o')}${k('Due soon',soonN,'Due Soon','k-s')}${k('Unpaid',c('Unpaid'),'Unpaid','k-u')}${k('Paid',c('Paid'),'Paid','k-p')}${ex.length?k('Need review',ex.length,'flag','k-r'):''}</div>
 <p class="mu" style="font-size:12px">More filters (partly paid, on hold, follow-ups) are in the Invoices tab. Totals are per currency, never mixed.</p>
 <h3>Follow-ups ${due.length?'due now':''}</h3>${fu.slice(0,8).map(t=>{const i=M.inv.find(x=>x.id===t.invoiceId);return i?`<div class="row"><b>${esc(fdt(t.date))}</b> ${t.date<today()?'<span class="st Overdue">late</span>':''}${t.status==='snoozed'?'<span class="st">snoozed</span>':''} ${esc(i.invoiceNo||'—')} · ${esc(i.customer)} <button class="btn s" data-a="open" data-v="${i.id}">Open</button><button class="btn s" data-a="snz" data-v="${t.id}">Snooze 3 days</button></div>`:''}).join('')||'<p class="mu">Nothing scheduled.</p>'}
 <h3>Exceptions to review</h3>${ex.slice(0,15).map(r=>`<div class="msg"><b>${esc(r.inv.invoiceNo||'—')} · ${esc(r.inv.customer||'(no customer)')}</b>: ${esc(r.flags.join('; '))} <button class="btn s" data-a="open" data-v="${r.inv.id}">Open</button></div>`).join('')||'<p class="mu">No exceptions.</p>'}`}
const fdt=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');return m?m[3]+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1]+' '+m[1]:(d||'')};
function vInv(rs){
 const sel=rs.filter(pass).sort((a,b)=>b.pr.s-a.pr.s||(a.inv.dueDate||'z')<(b.inv.dueDate||'z')?-1:1),cur=[...new Set(M.inv.map(i=>i.currency))];
 const cn=k=>rs.filter(r=>k==='Overdue'?r.status==='Overdue':k==='Due Soon'?r.status==='Due Soon':k==='due7'?(r.open&&r.daysTo!=null&&r.daysTo>=0&&r.daysTo<=7):true).length;
 const chips=[['','All'],['Overdue','Overdue','bad'],['Due Soon','Due soon'],['due7','Due in 7 days']].map(([v,l,c])=>`<button data-a="flt" data-v="${v}" class="${F.st===v?'on':''} ${c||''}" aria-pressed="${F.st===v}">${l} (${cn(v)})</button>`).join('');
 return`<div class="ch">${chips}</div><div class="row"><input id="q" placeholder="Search invoice, customer, contact" value="${esc(F.q)}"><select id="fs">${[['','More filters…'],['Unpaid'],['Partially Paid'],['partial','Partly paid (incl. overdue)'],['Paid'],['Overpaid'],['Hold','Disputed / on hold'],['Cancelled'],['fu','Follow-up due'],['flag','Has flags']].map(([v,l])=>`<option value="${v}" ${F.st===v?'selected':''}>${l||v}</option>`).join('')}</select>
 <select id="fc"><option value="">All currencies</option>${cur.map(c=>`<option ${F.cur===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn" data-a="add">+ Add invoice</button><span class="mu">${sel.length} shown</span></div>
 <div class="tw"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Due</th><th>Cur</th><th class="n">Total</th><th class="n">Paid</th><th class="n">Outstanding</th><th class="n">Days over</th><th>Status</th><th>Priority</th><th>Next follow-up</th><th></th></tr></thead><tbody>
 ${sel.slice(0,F.limit).map(r=>{const c=r.inv.currency;return`<tr data-a="open" data-v="${r.inv.id}" class="clk ${r.status==='Overdue'?'rov':r.status==='Due Soon'?'rsoon':''}"><td>${esc(r.inv.invoiceNo||'—')}</td><td>${esc(r.inv.customer)}<br><small class="mu">${esc(r.inv.email||r.inv.phone)}</small></td><td title="${esc(r.inv.dueDate||'')}">${r.inv.dueDate?fdt(r.inv.dueDate):'<span class="mu">missing</span>'}</td><td>${c}</td><td class="n">${$f(r.inv.total,c)}</td><td class="n">${$f(r.paid,c)}</td><td class="n">${$f(r.bal,c)}</td><td class="n">${r.open&&r.daysOver?r.daysOver:''}</td><td>${badge(r.status)}${r.partial&&r.status!=='Partially Paid'?' <small class="mu">part-paid</small>':''}${r.flags.length?' ⚠':''}</td><td title="${esc(r.pr.why.join(', '))}">${r.pr.lvl}</td><td>${fdt(r.next||'')}</td><td><button class="btn s" data-a="open" data-v="${r.inv.id}">Open</button></td></tr>`}).join('')||'<tr><td colspan="12" class="mu">No matching invoices.</td></tr>'}</tbody></table></div>
 ${sel.length>F.limit?'<button class="btn" data-a="more">Show more</button>':''}`}
function vRem(rs){
 const op=rs.filter(r=>r.open||r.paid>0).sort((a,b)=>b.pr.s-a.pr.s);if(!op.length)return'<div class="card mu">No invoices to remind about yet.</div>';
 const r=op.find(x=>x.inv.id===RM.id)||op[0];if(RM.id!==r.inv.id){RM={id:r.inv.id,tpl:PF.recommend(r)||'upcoming',dirty:false}}
 const d=PF.draft(RM.tpl,r,M.S);if(!RM.dirty&&!d.blocked){RM.subject=d.subject;RM.body=d.body}
 const recent=r.lastPay&&PF.daysBetween(r.lastPay,today())<=3;
 return`<div class="card"><div class="fl"><label>Invoice<select id="ri">${op.map(x=>`<option value="${x.inv.id}" ${x===r?'selected':''}>${esc(x.inv.invoiceNo||'—')} · ${esc(x.inv.customer)} · ${x.inv.currency} ${$f(x.bal,x.inv.currency)}</option>`).join('')}</select></label>
 <label>Template<select id="rt">${Object.entries(PF.TPL).map(([k,t])=>`<option value="${k}" ${RM.tpl===k?'selected':''} ${t.ok(r)?'':'disabled'}>${t.label}${t.ok(r)?'':' (not applicable)'}</option>`).join('')}</select></label></div>
 ${recent?'<div class="msg">A payment was recorded in the last 3 days. Confirm before saying a balance is unpaid.</div>':''}${r.flags.length?`<div class="msg">This record has flags: ${esc(r.flags.join('; '))}. Verify before sending.</div>`:''}

 if(e.target.id==='pa'){const i=find(OPEN),r=rows().find(x=>x.inv.id===OPEN),m=PF.parseMoney(e.target.value,i.currency);$('#pv').textContent=m.v>0?`Resulting outstanding: ${i.currency} ${$f(r.bal-m.v,i.currency)}${m.v>r.bal?' (overpayment)':''}`:''}});
const cs=c=>{if(!c||c.v==null)return'';if(c.t==='n'){if(c.z&&XLSX.SSF.is_date(c.z)){const d=XLSX.SSF.parse_date_code(c.v);return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}return/^0\d+$/.test(c.w||'')?c.w:String(c.v)}if(c.t==='d')return c.v.toISOString().slice(0,10);return String(c.v).trim()};
function aoa(ws){const r=XLSX.utils.decode_range(ws['!ref']||'A1'),o=[];for(let R=r.s.r;R<=r.e.r;R++){const row=[];for(let C=r.s.c;C<=r.e.c;C++)row.push(cs(ws[XLSX.utils.encode_cell({r:R,c:C})]));o.push(row)}return o}
function build(name,a){let h=-1,best=-1;a.slice(0,30).forEach((r,i)=>{if(r.filter(Boolean).length<2)return;const sc=Object.keys(PF.autoMap(r.map((x,j)=>String(x||'Column '+(j+1)))).map).length;if(sc>best){best=sc;h=i}});if(h<0||a.length<h+2)throw Error('No data rows found.');
 const seen={},heads=a[h].map((x,i)=>{let b=x||'Column '+(i+1),n=b,k=2;while(seen[n])n=b+'_'+k++;seen[n]=1;return n}),data=a.slice(h+1).filter(r=>r.some(Boolean)).map(r=>Object.fromEntries(heads.map((k,i)=>[k,r[i]??''])));
 const am=PF.autoMap(heads),G={name,heads,rows:data,am,sel:{...am.map},res:null};if(G.sel.total||G.sel.outstanding)G.res=PF.stageRows(G.rows,G.sel,M.S,M.inv);return G}
function staged(){T='imp';toast(!STG.res?'Pick the amount column below':STG.res.needBiz?'Choose which name is your business':STG.res.good.length+' invoices ready. Click Import.')}
async function readFile(f){if(!f)return;T='imp';STG=null;
 try{if(!window.XLSX)throw Error('Excel library did not load. Check your connection.');if(f.size>25e6)throw Error('File is larger than 25 MB.');
  let wb;if(/\.csv$/i.test(f.name))wb=XLSX.read(new TextDecoder().decode(await f.arrayBuffer()).replace(/^\uFEFF/,''),{type:'string',raw:true});else if(/\.xlsx?$/i.test(f.name))wb=XLSX.read(await f.arrayBuffer(),{type:'array'});else throw Error('Use .xlsx, .xls or .csv');
  STG=build(f.name,aoa(wb.Sheets[wb.SheetNames[0]]));staged()}catch(e){toast(e.message);T='imp'}render()}
/* Called by the launcher when the Invoices tool sends its results straight over (no download/upload needed). */
window.receiveRows=(name,a)=>{try{STG=build(name,a);staged()}catch(e){STG=null;T='imp';toast(e.message)}render()};
$('#an').onclick=()=>{if(STG&&T==='imp'){STG.res=PF.stageRows(STG.rows,STG.sel,M.S,M.inv);if(!STG.sel.total&&!STG.sel.outstanding)toast('Map a Total or Outstanding column first')}
 else{const rs=rows();T='ov';toast(`${rs.length} invoices analyzed, ${rs.filter(r=>r.flags.length).length} need review`)}render()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&OPEN){OPEN=null;render()}if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('dz')){e.preventDefault();e.target.click()}});
/* drop a sheet anywhere in this tool */
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();const z=e.target.closest&&e.target.closest('.dz');if(z)z.classList.add('on')}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.dz');if(z)z.classList.remove('on')});
document.addEventListener('drop',e=>{e.preventDefault();document.querySelectorAll('.dz.on').forEach(z=>z.classList.remove('on'));const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f)});
document.addEventListener('change',async e=>{if(e.target.id!=='fr')return;const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());if(!j||j.v!==1||!['inv','pay','con','tsk'].every(k=>Array.isArray(j[k])))throw Error('This is not a valid backup file.');
  if(!confirm('Replace ALL current data ('+M.inv.length+' invoices) with this backup ('+j.inv.length+' invoices)?'))return;
  RESCUE=null;M={v:1,S:{...DEF,...j.S},inv:j.inv,pay:j.pay,con:j.con,tsk:j.tsk,bat:j.bat||[]};save();toast('Backup restored')}catch(x){toast(x.message)}render()});
const THEMES=[['ocean','Ocean','#2563eb'],['forest','Forest','#0f7a55'],['sunset','Sunset','#c2410c'],['grape','Grape','#6d28d9'],['midnight','Midnight','#0b1220']];
function setTheme(t,keep){document.documentElement.dataset.theme=t;if(!keep)try{localStorage.setItem('bpTheme',t)}catch(e){}
 $('#th').innerHTML=THEMES.map(([k,l,c])=>`<button class="dot" data-t="${k}" style="background:${c}" title="${l}" aria-label="${l} theme" aria-pressed="${k===t}"></button>`).join('');
 try{const s=getComputedStyle(document.documentElement),g=n=>s.getPropertyValue(n).trim();parent.postMessage({bpTheme:{'--bg':g('--bg'),'--card':g('--cd'),'--tx':g('--tx'),'--mu':g('--mu'),'--bd':g('--bd'),'--pr':g('--pr'),'--prt':g('--prt'),'--gr':g('--ok')}},'*')}catch(e){}}
let savedTheme;try{savedTheme=localStorage.getItem('bpTheme')}catch(e){}
setTheme(THEMES.some(x=>x[0]===savedTheme)?savedTheme:(matchMedia('(prefers-color-scheme:dark)').matches?'midnight':'ocean'),true);
$('#th').onclick=e=>{const b=e.target.closest('.dot');if(b)setTheme(b.dataset.t)};
render();
</script></body></html>
