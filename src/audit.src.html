<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Business Audit – BizPilot AI</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https: http://localhost:* http://127.0.0.1:*; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:">
<style>
:root{color-scheme:light dark;--bg:#f4f6fb;--cd:#fff;--tx:#0f1b33;--mu:#5b6a85;--bd:#e3e8f1;--pr:#2563eb;--ok:#12b886;--wa:#f5b301;--er:#e03131}
@media(prefers-color-scheme:dark){:root{--bg:#0a1020;--cd:#121a2e;--tx:#e9eefb;--mu:#93a1bf;--bd:#223052;--pr:#5b9bff;--ok:#38d9a9;--wa:#ffd43b;--er:#ff8787}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:1180px;margin:0 auto;padding:14px}h1{font-size:21px;margin:0}h2{font-size:16px;margin:0 0 6px}h3{margin:14px 0 6px;font-size:14px}.mu{color:var(--mu)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 12px}.tb{border:0;background:none;padding:7px 13px;border-radius:99px;color:var(--mu);font-weight:600;cursor:pointer}.tb[aria-selected=true]{background:var(--pr);color:#fff}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:9px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}.btn.p{background:var(--pr);color:#fff;border:0;padding:10px 22px;font-size:15px}.btn.s{padding:3px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}textarea{width:100%}
:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.fl label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.kp>div{border:1px solid var(--bd);border-radius:10px;padding:9px 11px}.kp b{display:block;font-size:20px}
.tw{overflow:auto;border:1px solid var(--bd);border-radius:10px;max-height:64vh}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--cd)}td.w{min-width:240px;white-space:normal;word-break:break-word}
.sv{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;background:var(--bd)}.sv.critical,.sv.high{background:color-mix(in srgb,var(--er) 28%,transparent)}.sv.medium{background:color-mix(in srgb,var(--wa) 32%,transparent)}
.msg{padding:8px 11px;border-radius:9px;margin:6px 0;border-left:4px solid var(--wa);background:color-mix(in srgb,var(--wa) 12%,transparent)}.msg.e{border-color:var(--er);background:color-mix(in srgb,var(--er) 12%,transparent)}.msg.i{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,transparent)}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#0f1b33;color:#fff;padding:9px 15px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:20}#toast.on{opacity:1}

a{color:var(--pr)}
.kp>div{padding:12px 14px;border-radius:12px}.kp b{font-size:22px;letter-spacing:-.02em}
.kp:first-of-type>div:first-child{background:color-mix(in srgb,var(--pr) 6%,transparent)}
.sco{font-size:34px!important;line-height:1.1}.sco small{font-size:14px;font-weight:600;color:var(--mu)}.sco.g{color:var(--ok)}.sco.w{color:#d99a00}.sco.r{color:var(--er)}
h3.ap{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-size:14px;color:var(--tx)}h3.ap .dt{width:10px;height:10px;border-radius:50%;background:var(--pr)}h3.ap.c .dt{background:var(--er)}h3.ap.w .dt{background:var(--wa)}h3.ap.n .dt{background:var(--mu)}
h3.ap .ct{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--bd);color:var(--mu)}
.ai{display:grid;gap:2px;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;background:var(--bg)}.ai span{color:var(--mu);font-size:13px}
details>summary{cursor:pointer;font-weight:600;padding:4px 0}
</style></head><body><main>
<h1>Business Audit</h1><span class="mu">Evidence-based website and business-profile checks. Nothing is changed on your website.</span>
<div class="tabs" id="tabs" role="tablist"></div><div id="main"></div></main><div id="toast" role="status" aria-live="polite"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script>window.XLSX||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>')</script>
<script src="vendor/jspdf.umd.min.js"></script>
<script>window.jspdf||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"><\/script>')</script>
<script>/*CORE*/</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='bpBusinessAudit.v1';
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1)return j}catch(e){}return{v:1,S:{server:'',token:'',maxPages:8},prof:{touched:false,f:{}},comps:'',form:{url:'',business:'',category:'',city:''},hist:[]}}
let A=load(),T='new',CUR=null,busy=false,LOG=[],FL={q:'',sev:'',cat:''},DIFF=null,saveErr=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(A));saveErr=false}catch(e){saveErr=true}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4000)};
const TABS=[['new','New Audit'],['res','Audit Results'],['prof','Business Profile Checklist'],['cmp','Competitor Comparison'],['hist','Audit History'],['set','Settings']];
const cur=()=>A.hist.find(h=>h.id===CUR);
const safeHref=u=>/^https?:\/\//i.test(u)?esc(u):'';
const link=u=>u?(safeHref(u)?`<a href="${safeHref(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`:esc(u)):'<span class="mu">site-wide</span>';
function vNew(){const F=A.form,srv=!!A.S.server;
 return`${srv?'':'<div class="msg i"><b>Live crawling is not set up.</b> The audit server is not configured (see Settings and AUDIT_SETUP.md). You can still audit one page by pasting its HTML source below. Single-page audits run fewer checks and are labelled as such.</div>'}
 <div class="card"><div class="fl"><label>Website URL *<input id="u" placeholder="https://example.com" value="${esc(F.url)}"></label><label>Business name<input id="bn" value="${esc(F.business)}"></label><label>Business category<input id="bc" value="${esc(F.category)}"></label><label>City or service area<input id="bci" value="${esc(F.city)}"></label></div>
 ${srv?'':`<label class="mu">Page source (View Source → copy all)</label><textarea id="src" rows="5" placeholder="<!doctype html>..."></textarea>`}
 <p class="mu">Optional: Business Profile details and competitor URLs are set in their own tabs.</p>
 <button class="btn p" id="run" ${busy?'disabled':''}>${busy?'Running…':'Run Business Audit'}</button>
 ${LOG.length?`<div style="margin-top:8px">${LOG.map(l=>`<div class="mu">${l}</div>`).join('')}</div>`:''}</div>`}
function sc(a){const s=a.score;return s.overall==null?`<b>n/a</b><span class="mu">Insufficient data for a reliable score: ${esc(s.reason)}</span>`:`<b class="sco ${s.overall>=80?'g':s.overall>=60?'w':'r'}">${s.overall}<small>/100</small></b><span class="mu">Website score (not a Google score)</span>`}
function vRes(){const a=cur();if(!a)return'<div class="card mu">No audit yet. Run one from New Audit, or open one from History.</div>';
 const cnt=s=>a.findings.filter(f=>f.sev===s).length,fs=a.findings.filter(f=>{const q=FL.q.toLowerCase();return(!FL.sev||f.sev===FL.sev)&&(!FL.cat||f.cat===FL.cat)&&(!q||[f.title,f.evidence,f.url,f.action].join(' ').toLowerCase().includes(q))}).sort((x,y)=>AU.PTS[y.sev]-AU.PTS[x.sev]);
 const cats=[...new Set(a.findings.map(f=>f.cat))];
 return`<div class="card"><h2>${esc(a.business||a.url)}</h2><div class="mu">${link(a.url)} · ${a.ts.slice(0,16).replace('T',' ')} UTC · Source: ${esc(a.source)}</div>
 <div class="kp" style="margin-top:8px"><div>${sc(a)}</div><div><b>${a.score.coverage.ran}/${a.score.coverage.total}</b><span class="mu">checks completed</span></div><div><b>${a.profile.completeness?a.profile.completeness.pct+'%':'n/a'}</b><span class="mu">profile completeness (user-entered)</span></div><div><b>${a.pages.analyzed}</b><span class="mu">pages analysed · ${a.pages.failed} failed · ${a.pages.skipped} skipped · ${a.pages.discovered} discovered</span></div><div><b>${cnt('critical')} / ${cnt('high')}</b><span class="mu">critical / high</span></div><div><b>${cnt('medium')} / ${cnt('low')}</b><span class="mu">medium / low</span></div></div>
 ${a.scope==='single-page-source'?'<div class="msg">Single page only (pasted source). This is not a full-site audit.</div>':a.pages.analyzed===1?'<div class="msg">Homepage-only audit: no other pages could be analysed.</div>':''}
 <details><summary>Score breakdown and method</summary>${Object.values(a.score.cats).map(c=>`<div>${c.label}: <b>${c.score==null?'not assessed':c.score}</b> <span class="mu">(${c.ran}/${c.total} checks run)</span></div>`).join('')}${a.score.deductions.map(d=>`<div class="mu">−${d.pts} ${esc(d.label)} (${d.sev}, ${d.affected} affected)</div>`).join('')}<p class="mu">${esc(a.score.method)}</p></details>
 <details><summary>Limitations and data sources</summary>${a.limits.map(l=>`<div class="mu">• ${esc(l)}</div>`).join('')}</details>
 ${DIFF&&DIFF.id===a.id?`<div class="msg i">Compared with previous audit of this site (${DIFF.comparable} comparable checks): <b>${DIFF.newF.length} new</b>, <b>${DIFF.resolved.length} no longer found</b>, ${DIFF.unchanged} unchanged.</div>`:''}
 <div class="row"><button class="btn p" data-a="pdf" style="padding:7px 14px;font-size:14px">PDF report</button><button class="btn" data-a="xlsx">Excel</button><button class="btn" data-a="csvf">CSV findings</button><button class="btn" data-a="csvr">CSV recommendations</button><button class="btn" data-a="rerun">Re-run audit</button></div></div>
 <div class="card"><h2>Action plan</h2>${['Fix first','Important improvements','Further optimization','Informational suggestions'].map(g=>{const x=a.findings.filter(f=>AU.BUCKET(f.sev)===g);return x.length?`<h3 class="ap ${{'Fix first':'c','Important improvements':'w','Further optimization':'i'}[g]||'n'}"><span class="dt"></span>${g} <span class="ct">${x.length}</span></h3>${x.slice(0,5).map(f=>`<div class="ai"><b>${esc(f.title)}</b><span>${esc(f.action)}</span></div>`).join('')}${x.length>5?`<div class="mu">+${x.length-5} more in the table below</div>`:''}`:''}).join('')||'<p class="mu">No findings.</p>'}</div>
 <div class="row"><input id="fq" placeholder="Search findings" value="${esc(FL.q)}"><select id="fsv"><option value="">All severities</option>${['critical','high','medium','low','info'].map(s=>`<option ${FL.sev===s?'selected':''}>${s}</option>`).join('')}</select><select id="fct"><option value="">All categories</option>${cats.map(s=>`<option ${FL.cat===s?'selected':''}>${s}</option>`).join('')}</select><span class="mu">${fs.length} of ${a.findings.length}</span></div>
 <div class="tw"><table><thead><tr><th>Severity</th><th>Category</th><th>Affected URL</th><th>Finding</th><th>Evidence</th><th>Recommended fix</th><th>Status / notes</th></tr></thead><tbody>
 ${fs.map(f=>`<tr><td><span class="sv ${f.sev}">${f.sev}</span><br><small class="mu">${f.verified?'verified':'inferred / user-entered'}</small></td><td>${f.cat}</td><td class="w">${link(f.url)}</td><td class="w"><b>${esc(f.title)}</b><br><small class="mu">${esc(f.why)}</small></td><td class="w">${esc(f.evidence)}</td><td class="w">${esc(f.action)}<br><small class="mu">Effort: ${f.effort}</small></td><td><select data-fs="${esc(f.id)}"><option value="open" ${f.state==='open'?'selected':''}>Open</option><option value="resolved" ${f.state==='resolved'?'selected':''}>Marked resolved (by you)</option><option value="ignored" ${f.state==='ignored'?'selected':''}>Ignored</option></select><br><input data-fn="${esc(f.id)}" placeholder="Note" value="${esc(f.note)}"></td></tr>`).join('')||'<tr><td colspan="7" class="mu">No matching findings.</td></tr>'}</tbody></table></div>
 <p class="mu">“Marked resolved” records your action only. The site is not re-checked until you re-run the audit.</p>`}
function vProf(){const P=A.prof;return`<div class="msg i"><b>Live Google Business Profile integration: not available.</b> No Google authorisation is configured in this app, so nothing here is read from Google. Everything below is <b>user-provided and unverified</b>. Tick “N/A” for fields that do not apply to your business.</div>
 <div class="card"><div class="fl">${AU.FIELDS.map(([k,l])=>{const f=P.f[k]||{};return`<label>${l}<span class="row" style="margin:0"><input data-pf="${k}" value="${esc(f.v)}" style="flex:1"><span><input type="checkbox" data-pn="${k}" ${f.na?'checked':''}> N/A</span></span></label>`}).join('')}</div>
 <p class="mu">Fields you leave blank are reported as Missing once you save. Compared with the website at the next audit.</p><button class="btn p" data-a="saveprof" style="padding:7px 16px;font-size:14px">Save checklist</button> <button class="btn" data-a="clrprof">Clear</button></div>
 ${cur()&&cur().profile.rows.some(r=>r.status!=='Not checked')?`<div class="card"><h2>Last audit result</h2><div class="tw"><table><tr><th>Field</th><th>Status</th><th>Value (user-entered)</th></tr>${cur().profile.rows.map(r=>`<tr><td>${r.label}</td><td>${r.status}</td><td>${esc(r.value)}</td></tr>`).join('')}</table></div></div>`:''}`}
function vCmp(){const a=cur();return`<div class="card"><label class="mu">Competitor website URLs you choose (one per line, max 3). Only these are analysed.</label><textarea id="cm" rows="3">${esc(A.comps)}</textarea><button class="btn" data-a="savecmp">Save</button><p class="mu">Applied on the next audit. Traffic, backlinks, rankings and reviews are not available from this tool.</p></div>
 ${a&&a.competitors.length?`<div class="tw"><table><thead><tr><th>Site</th><th>Pages</th><th>HTTPS</th><th>Title</th><th>Description</th><th>H1</th><th>Canonical</th><th>Viewport</th><th>Schema</th><th>robots</th><th>sitemap</th><th>TTFB ms</th></tr></thead><tbody>${a.competitors.map(c=>c.error?`<tr><td>${link(c.url)}</td><td colspan="11">Could not be analysed: ${esc(c.error)}</td></tr>`:`<tr><td>${link(c.url)}</td><td>${c.pages}</td>${[c.https,c.title,c.desc,c.h1,c.canonical,c.viewport].map(v=>`<td>${v==null?'–':v?'yes':'no'}</td>`).join('')}<td>${esc(c.schema)}</td><td>${c.robots??'–'}</td><td>${c.sitemap??'–'}</td><td>${c.ttfb??'–'}</td></tr>`).join('')}</tbody></table></div><p class="mu">Compared: homepage (+ up to 2 more pages) of each supplied URL. Metrics with no reliable source are not shown.</p>`:'<p class="mu">No competitor data in the current audit.</p>'}`}
function vHist(){return A.hist.length?`<div class="tw"><table><thead><tr><th>When (UTC)</th><th>Site</th><th>Source</th><th>Pages</th><th>Score</th><th>Findings</th><th></th></tr></thead><tbody>${A.hist.map(h=>`<tr><td>${h.ts.slice(0,16).replace('T',' ')}</td><td>${esc(h.business||h.url)}</td><td>${esc(h.source)}</td><td>${h.pages.analyzed}</td><td>${h.score.overall==null?'n/a':h.score.overall}</td><td>${h.findings.length}</td><td><button class="btn s" data-a="open" data-v="${h.id}">Open</button> <button class="btn s" data-a="del" data-v="${h.id}">Delete</button></td></tr>`).join('')}</tbody></table></div><p class="mu">Stored in this browser only. Page content is not kept, only results.</p>`:'<div class="card mu">No saved audits yet.</div>'}
function vSet(){const S=A.S;return`<div class="card"><div class="fl"><label>Audit server URL<input data-set="server" placeholder="https://audit.yourdomain.com" value="${esc(S.server)}"></label><label>Access token<input data-set="token" type="password" value="${esc(S.token)}"></label><label>Max pages to analyse (1–15)<input data-set="maxPages" type="number" min="1" max="15" value="${S.maxPages}"></label></div>
 <p class="mu">The server fetches the website for you (a browser cannot). Your URL, competitor URLs and token are sent to that server only. The token is stored in this browser; use a token meant for this purpose. Business Profile details are never sent to the server.</p>
 <button class="btn" data-a="health">Test connection</button> <button class="btn" data-a="wipe">Delete all audit data</button></div>`}
function render(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tb" role="tab" data-a="tab" data-v="${k}" aria-selected="${T===k}">${l}</button>`).join('');
 $('#main').innerHTML=(saveErr?'<div class="msg e">Could not save to this browser (storage full). Export your report now.</div>':'')+{new:vNew,res:vRes,prof:vProf,cmp:vCmp,hist:vHist,set:vSet}[T]()}
const log=m=>{LOG.push(new Date().toLocaleTimeString()+' · '+m);if(T==='new')render()};
function normUrl(s){s=String(s||'').trim();if(!s)return null;if(!/^[a-z]+:\/\//i.test(s))s='https://'+s;try{const u=new URL(s);return/^https?:$/.test(u.protocol)?u.href:null}catch(e){return null}}
async function run(){const url=normUrl($('#u').value);A.form={url:$('#u').value,business:$('#bn').value,category:$('#bc').value,city:$('#bci').value};save();LOG=[];
 if(!url)return toast('Enter a valid http(s) website URL');const src=$('#src')?$('#src').value.trim():'';if(!A.S.server&&!src)return toast('Paste the page source, or set up the audit server in Settings');
 busy=true;log('Validating URL: '+url);let site,comps=[];
 try{if(A.S.server){const cl=A.comps.split(/\s+/).map(normUrl).filter(Boolean).slice(0,3);log('Sending to audit server. Crawl runs on the server, so per-page progress is not available. Waiting…');
   const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),150000);let r;try{r=await fetch(A.S.server.replace(/\/$/,'')+'/audit',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+A.S.token},body:JSON.stringify({url,competitors:cl,maxPages:A.S.maxPages})})}catch(e){throw Error(e.name==='AbortError'?'The audit server took too long (150 s).':'Could not reach the audit server. Check the URL in Settings and that the server is running.')}finally{clearTimeout(tm)}
   const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Audit server error '+r.status);site=j.site;comps=j.competitors||[];log(`Server returned ${site.pages.length} page(s). Analysing locally…`);if(site.error)throw Error('The website could not be audited: '+site.error)}
  else{log('Analysing pasted source (single page)…');site={startUrl:url,finalUrl:url,scope:'single-page-source',pages:[{url,status:null,facts:AU.extract(src,url)}],failed:[],skipped:0,discovered:1,linkChecks:[],imageChecks:[]}}
  log('Running deterministic checks and scoring…');const a=AU.makeAudit(site,{business:$('#bn').value.trim(),category:$('#bc').value.trim(),city:$('#bci').value.trim()},A.prof,comps);
  const prev=A.hist.find(h=>new URL(h.url).hostname===new URL(a.url).hostname);DIFF=prev?{id:a.id,...AU.diff(prev,a)}:null;
  A.hist.unshift(a);A.hist=A.hist.slice(0,20);save();CUR=a.id;log('Saved to history.');T='res'}
 catch(e){log('Stopped: '+e.message);toast(e.message)}busy=false;render()}
function dl(blob,n){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const fname=(a,e)=>'audit_'+(new URL(a.url).hostname)+'_'+a.ts.slice(0,10)+'.'+e;
const AC={tab:v=>T=v,open:v=>{CUR=v;T='res'},del:v=>{if(confirm('Delete this audit?')){A.hist=A.hist.filter(h=>h.id!==v);save()}},rerun:()=>{const a=cur();A.form.url=a.url;T='new';save()},
 saveprof:()=>{const f={};AU.FIELDS.forEach(([k])=>{f[k]={v:document.querySelector(`[data-pf=${k}]`).value,na:document.querySelector(`[data-pn=${k}]`).checked}});A.prof={touched:true,f};save();toast('Saved. It will be used in the next audit.')},clrprof:()=>{A.prof={touched:false,f:{}};save()},
 savecmp:()=>{A.comps=$('#cm').value;save();toast('Saved')},wipe:()=>{if(confirm('Delete all saved audits and settings?')){A=load();A.hist=[];A.S={server:'',token:'',maxPages:8};save();CUR=null}},
 health:async()=>{try{const r=await fetch(A.S.server.replace(/\/$/,'')+'/health');toast(r.ok?'Audit server reachable':'Server responded '+r.status)}catch(e){toast('Cannot reach the audit server')}},
 pdf:()=>{if(!window.jspdf)return toast('PDF library did not load. Check your connection.');const b=new Blob([AU.pdf(window.jspdf.jsPDF,cur())],{type:'application/pdf'});if(b.size<500)return toast('PDF generation failed');dl(b,fname(cur(),'pdf'));toast('PDF downloaded ('+Math.round(b.size/1024)+' KB)')},
 xlsx:()=>{if(!window.XLSX)return toast('Excel library did not load. Check your connection.');const S=AU.sheets(cur()),wb=XLSX.utils.book_new();for(const k in S){const ws=XLSX.utils.aoa_to_sheet(S[k]);ws['!cols']=S[k][0].map(()=>({wch:24}));XLSX.utils.book_append_sheet(wb,ws,k.slice(0,31))}const b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]);if(b.size<500)return toast('Excel generation failed');dl(b,fname(cur(),'xlsx'));toast('Excel downloaded')},
 csvf:()=>{const S=AU.sheets(cur());dl(new Blob([AU.csv([S['Technical Findings'][0],...S['Technical Findings'].slice(1),...S['On-page Findings'].slice(1)])],{type:'text/csv;charset=utf-8'}),fname(cur(),'findings.csv'));toast('CSV downloaded')},
 csvr:()=>{dl(new Blob([AU.csv(AU.sheets(cur()).Recommendations)],{type:'text/csv;charset=utf-8'}),fname(cur(),'recommendations.csv'));toast('CSV downloaded')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a],#run');if(!b)return;if(b.id==='run')return run();const f=AC[b.dataset.a];if(!f)return;try{const r=f(b.dataset.v);if(r&&r.then)r.then(render)}catch(x){toast('Error: '+x.message)}render()});
document.addEventListener('change',e=>{const t=e.target,a=cur();
 if(t.id==='fsv')FL.sev=t.value;else if(t.id==='fct')FL.cat=t.value;else if(t.id==='fq')FL.q=t.value;
 else if(t.dataset.fs){a.findings.find(f=>f.id===t.dataset.fs).state=t.value;save();return}else if(t.dataset.fn){a.findings.find(f=>f.id===t.dataset.fn).note=t.value;save();return}
 else if(t.dataset.set){const k=t.dataset.set;A.S[k]=k==='maxPages'?Math.min(15,Math.max(1,parseInt(t.value)||8)):t.value.trim();save();return toast('Saved')}else return;render()});
render();
</script></body></html>
